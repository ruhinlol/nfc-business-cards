<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6F47" />
      <stop offset="100%" stop-color="#4A3728" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#coffeeGrad)" />
  <!-- Coffee Cup Icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" transform="translate(100, 110)">
    <!-- Steam lines -->
    <path d="M40 0 C40 20 60 20 60 40" stroke-width="10" opacity="0.8" />
    <path d="M100 0 C100 20 120 20 120 40" stroke-width="10" opacity="0.8" />
    <path d="M160 0 C160 20 180 20 180 40" stroke-width="10" opacity="0.8" />
    <!-- Cup Body -->
    <path d="M10 60 L190 60 C190 150 150 180 100 180 C50 180 10 150 10 60 Z" fill="#FFFFFF" fill-opacity="0.15" />
    <!-- Handle -->
    <path d="M190 80 C220 80 220 130 190 140" />
    <!-- Saucer -->
    <path d="M0 195 L200 195" stroke-width="14" />
  </g>
  <text x="200" y="345" font-family="'Inter', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">RIVERMANIA</text>
</svg>
